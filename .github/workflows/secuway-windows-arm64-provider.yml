name: secuway-windows-arm64-provider

# Required checks run unconditionally. Relevant roots include
# "src/lea_provider.cpp", "experiments/windows-arm64/**", and
# "plugins/secuway-vpn/skills/secuway-vpn/assets/**".
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact workflow commit
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout mismatch: expected $env:GITHUB_SHA, got $actual"
          }

      - name: Configure ARM64-targeting MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64_arm64
          sdk: 10.0.26100.0
          toolset: 14.44
          vsversion: 2022

      - name: Build against OpenVPN's pinned OpenSSL and run native tests
        shell: pwsh
        run: ./experiments/windows-arm64/ci/build-and-test.ps1

      - name: Upload validated provider evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secuway-lea-windows-arm64-${{ github.sha }}
          path: experiments/windows-arm64/dist-ci/*
          if-no-files-found: error
          retention-days: 7
