name: secuway-windows-x64-provider

# Required checks run unconditionally. Relevant roots include
# "src/lea_provider.cpp", "experiments/windows-x64/**", and
# "plugins/secuway-vpn/skills/secuway-vpn/**".
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact workflow commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reproducible PE x64 build
        run: ./experiments/windows-x64/build.sh

      - name: Official OpenVPN runtime and LEA KAT under Wine
        run: ./experiments/windows-x64/verify-wine.sh

      - name: Match bundled x64 provider assets
        run: |
          cmp \
            experiments/windows-x64/artifacts/lea.dll \
            plugins/secuway-vpn/skills/secuway-vpn/assets/windows-amd64/lea.dll
          cmp \
            experiments/windows-x64/artifacts/provider_smoke.exe \
            plugins/secuway-vpn/skills/secuway-vpn/assets/windows-amd64/provider_smoke.exe

      - name: Upload x64 provider evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secuway-lea-windows-amd64-${{ github.sha }}
          path: experiments/windows-x64/artifacts/*
          if-no-files-found: error
          retention-days: 7

  native-install:
    needs: build-provider
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact workflow commit
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout mismatch: expected $env:GITHUB_SHA, got $actual"
          }

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: portable/go.mod
          cache-dependency-path: portable/go.sum

      - name: Download exact provider job output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: secuway-lea-windows-amd64-${{ github.sha }}
          path: provider

      - name: Install pinned official OpenVPN
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP "OpenVPN-2.7.5-I001-amd64.msi"
          Invoke-WebRequest `
            -Uri "https://swupdate.openvpn.org/community/releases/OpenVPN-2.7.5-I001-amd64.msi" `
            -OutFile $msi
          $expected = "20a9b2831cc3be26c250caf60891c230f3bf3e1e7bd6e17b4e182f166026377a"
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Official OpenVPN MSI hash mismatch: $actual"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne "Valid") {
            throw "Official OpenVPN MSI signature is not valid"
          }
          $process = Start-Process msiexec.exe `
            -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart") `
            -Wait `
            -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "OpenVPN MSI install failed with code $($process.ExitCode)"
          }

      - name: Build native CLI and validate one-time install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./build -Force | Out-Null
          Push-Location ./portable
          try {
            go test ./... -count=1
            go build -buildvcs=false -trimpath `
              -ldflags="-s -w -buildid=" `
              -o ../build/secuway-windows-amd64.exe `
              ./cmd/secuway
          }
          finally {
            Pop-Location
          }
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $setup = (
            Resolve-Path `
              ./plugins/secuway-vpn/skills/secuway-vpn/scripts/Setup-Windows.ps1
          ).Path
          $targetBin = Join-Path $env:RUNNER_TEMP "secuway-user-bin"
          $serviceBefore = (
            Get-Service -Name OpenVPNServiceInteractive
          ).Status.ToString()
          $userPathBefore = [Environment]::GetEnvironmentVariable("Path", "User")
          $installed = $false
          try {
            & pwsh -NoLogo -NoProfile -File $setup `
              -Action Install `
              -TargetSid $sid `
              -TargetBin $targetBin
            if ($LASTEXITCODE -ne 0) {
              throw "Secuway Windows setup failed with code $LASTEXITCODE"
            }
            $installed = $true
            $statusOutput = & pwsh -NoLogo -NoProfile -File $setup `
              -Action Status `
              -TargetSid $sid `
              -TargetBin $targetBin
            if ($LASTEXITCODE -ne 0) {
              throw "Secuway Windows status failed with code $LASTEXITCODE"
            }
            $status = $statusOutput |
              Where-Object { "$_".TrimStart().StartsWith("{") } |
              Select-Object -Last 1 |
              ConvertFrom-Json
            if ($status.status -ne "READY" -or $status.secrets_printed -ne $false) {
              throw "Unexpected install status: $($status | ConvertTo-Json -Compress)"
            }
            & (Join-Path $targetBin "secuway.exe") doctor
            if ($LASTEXITCODE -ne 0) {
              throw "Native secuway doctor failed"
            }
            $openvpnKey = Get-Item "HKLM:\SOFTWARE\OpenVPN"
            $openvpn = [string]$openvpnKey.GetValue("exe_path")
            if (-not $openvpn) {
              $openvpn = Join-Path ([string]$openvpnKey.GetValue("")) "bin\openvpn.exe"
            }
            $moduleDirectory = Join-Path ([string]$openvpnKey.GetValue("")) "ssl\modules"
            $oldModules = $env:OPENSSL_MODULES
            $oldPath = $env:PATH
            try {
              $env:OPENSSL_MODULES = $moduleDirectory
              $env:PATH = "$(Split-Path -Parent $openvpn);$oldPath"
              & ./provider/provider_smoke.exe
              if ($LASTEXITCODE -ne 0) {
                throw "Native Windows provider KAT failed"
              }
            }
            finally {
              $env:OPENSSL_MODULES = $oldModules
              $env:PATH = $oldPath
            }
          }
          finally {
            if ($installed) {
              & pwsh -NoLogo -NoProfile -File $setup `
                -Action Uninstall `
                -TargetSid $sid `
                -TargetBin $targetBin
              if ($LASTEXITCODE -ne 0) {
                throw "Secuway Windows uninstall failed with code $LASTEXITCODE"
              }
            }
          }
          $serviceAfter = (
            Get-Service -Name OpenVPNServiceInteractive
          ).Status.ToString()
          if ($serviceAfter -ne $serviceBefore) {
            throw "Interactive Service state was not restored"
          }
          $userPathAfter = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPathAfter -ne $userPathBefore) {
            throw "User PATH was not restored"
          }
          if (Test-Path -LiteralPath $targetBin) {
            throw "User CLI directory was not removed"
          }
